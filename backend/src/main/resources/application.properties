server.port=${SERVER_PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ironfit}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:replace-this-with-a-random-secret-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.bridge.secret=${IRONFIT_BRIDGE_SECRET:}
app.ai.anthropic-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
